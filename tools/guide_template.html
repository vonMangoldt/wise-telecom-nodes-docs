<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referral Protocol Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed book sidebar on the left, one reading column on the right; the sidebar folds into a top bar on phones. */
:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --ink: #1f2a2e;
  --muted: #5d6b70;
  --line: #d9d6cd;
  --accent: #0f6e5f;
  --accent-soft: #e3f0ec;
  --code-bg: #eeece6;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  --nav-w: 272px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191b; --surface: #1c2124; --ink: #e6e4dd; --muted: #a2aaad; --line: #30383c;
    --accent: #5fc3ad; --accent-soft: #1f3330; --code-bg: #242b2f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191b; --surface: #1c2124; --ink: #e6e4dd; --muted: #a2aaad; --line: #30383c;
  --accent: #5fc3ad; --accent-soft: #1f3330; --code-bg: #242b2f; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font-body); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.shell { display: flex; min-height: 100vh; }
nav.book {
  width: var(--nav-w); flex: 0 0 var(--nav-w); position: sticky; top: env(safe-area-inset-top, 0px); align-self: flex-start;
  height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line);
  padding-block: 24px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
.brand { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.25; text-wrap: balance; margin: 0 0 4px; }
.brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 6px; }
.toc { list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.toc > li > a { display: block; padding: 7px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
.toc > li > a:hover, .toc > li > a:focus-visible { background: var(--accent-soft); outline: none; }
.toc > li.active > a { background: var(--accent-soft); color: var(--accent); }
.toc ul { list-style: none; margin: 2px 0 6px; padding: 0 0 0 10px; border-left: 2px solid var(--line); display: none; flex-direction: column; gap: 1px; }
.toc li.active ul { display: flex; }
.toc ul a { display: block; padding: 4px 10px; font-size: 0.86rem; color: var(--muted); text-decoration: none; border-radius: 4px; }
.toc ul a:hover, .toc ul a:focus-visible { color: var(--accent); background: var(--accent-soft); outline: none; }
.topbar { display: none; }
main { flex: 1 1 auto; min-width: 0; }
.column { max-width: 760px; margin: 0 auto; padding-block: 40px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { .column { padding-left: 48px; padding-right: 48px; } }
article h1 { font-family: var(--font-display); font-weight: 600; font-size: 2.1rem; line-height: 1.15; margin: 0 0 20px; text-wrap: balance; }
article h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; line-height: 1.25; margin: 44px 0 12px; padding-top: 14px; border-top: 1px solid var(--line); text-wrap: balance; }
article h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.3; margin: 30px 0 8px; text-wrap: balance; }
article p { margin: 0 0 14px; }
article h1 + p { font-family: var(--font-display); font-size: 1.2rem; color: var(--muted); margin: -8px 0 24px; text-wrap: balance; }
article blockquote { margin: 18px 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; font-style: italic; }
article blockquote p { margin: 0; }
article blockquote p + p { margin-top: 8px; }
article ul, article ol { margin: 0 0 14px; padding-left: 22px; }
article li { margin: 0 0 8px; }
article a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
article a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--font-mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
pre code { background: none; padding: 0; }
.tbl { overflow-x: auto; margin: 0 0 16px; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.82rem; letter-spacing: 0.04em; text-transform: uppercase; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager a { color: var(--accent); text-decoration: none; font-weight: 600; }
.pager a:hover, .pager a:focus-visible { text-decoration: underline; outline: none; }
.pager span { display: block; font-size: 0.78rem; color: var(--muted); font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase; }
@media (max-width: 899px) {
  .shell { display: block; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar .brand { font-size: 1rem; margin: 0; }
  .topbar .brand small { display: none; }
  .topbar button { font: inherit; font-weight: 600; font-size: 0.9rem; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  .topbar button:focus-visible { outline: 2px solid var(--accent); }
  nav.book { position: static; width: auto; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  nav.book .brand { display: none; }
  nav.book[hidden] { display: none; }
  body { font-size: 16px; }
  article h1 { font-size: 1.7rem; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>

<div class="topbar">
  <p class="brand">Referral Protocol Guide</p>
  <button type="button" id="navToggle" aria-expanded="false" aria-controls="bookNav">Contents</button>
</div>
<div class="shell">
  <nav class="book" id="bookNav" aria-label="Contents">
    <p class="brand">WiseTelecomNodes Referral Protocol<small>Guide</small></p>
    <ul class="toc" id="toc"></ul>
  </nav>
  <main>
    <div class="column" id="content">
%%ARTICLES%%
      <div class="pager" id="pager"></div>
    </div>
  </main>
</div>

<script>
(function () {
  var NAV = %%NAV_JSON%%;
  var tokens = NAV.map(function (p) { return p.token; });
  var toc = document.getElementById('toc');
  var pager = document.getElementById('pager');
  var navEl = document.getElementById('bookNav');
  var toggle = document.getElementById('navToggle');
  var narrow = function () { return window.matchMedia('(max-width: 899px)').matches; };

  function closeNav() { if (narrow()) { navEl.hidden = true; toggle.setAttribute('aria-expanded', 'false'); } }
  function syncNav() { if (narrow()) { navEl.hidden = toggle.getAttribute('aria-expanded') !== 'true'; } else { navEl.hidden = false; } }
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', open ? 'false' : 'true');
    syncNav();
  });
  window.addEventListener('resize', syncNav);

  NAV.forEach(function (p) {
    var li = document.createElement('li');
    li.dataset.token = p.token;
    var a = document.createElement('a');
    a.href = '#' + p.token;
    a.textContent = p.title;
    a.addEventListener('click', function (e) { e.preventDefault(); show(p.token, null, true); });
    li.appendChild(a);
    if (p.sections.length) {
      var ul = document.createElement('ul');
      p.sections.forEach(function (s) {
        var sli = document.createElement('li');
        var sa = document.createElement('a');
        sa.href = '#' + p.token;
        sa.textContent = s.name;
        sa.addEventListener('click', function (e) { e.preventDefault(); show(p.token, s.id, true); });
        sli.appendChild(sa);
        ul.appendChild(sli);
      });
      li.appendChild(ul);
    }
    toc.appendChild(li);
  });

  function show(token, sectionId, push) {
    if (tokens.indexOf(token) < 0) { token = tokens[0]; }
    Array.prototype.forEach.call(document.querySelectorAll('article.page'), function (el) { el.hidden = el.dataset.token !== token; });
    Array.prototype.forEach.call(toc.children, function (li) { li.classList.toggle('active', li.dataset.token === token); });
    var idx = tokens.indexOf(token);
    pager.innerHTML = '';
    if (idx > 0) {
      var prev = document.createElement('a');
      prev.href = '#' + tokens[idx - 1];
      prev.innerHTML = '<span>Previous</span>' + NAV[idx - 1].title;
      prev.addEventListener('click', function (e) { e.preventDefault(); show(tokens[idx - 1], null, true); });
      pager.appendChild(prev);
    } else { pager.appendChild(document.createElement('span')); }
    if (idx < tokens.length - 1) {
      var next = document.createElement('a');
      next.href = '#' + tokens[idx + 1];
      next.style.textAlign = 'right';
      next.innerHTML = '<span>Next</span>' + NAV[idx + 1].title;
      next.addEventListener('click', function (e) { e.preventDefault(); show(tokens[idx + 1], null, true); });
      pager.appendChild(next);
    }
    if (push) { try { history.replaceState(null, '', '#' + token); } catch (e) {} }
    closeNav();
    var target = sectionId ? document.getElementById(sectionId) : null;
    if (target) { target.scrollIntoView({ block: 'start' }); } else { window.scrollTo(0, 0); }
    try { localStorage.setItem('rpg-page', token); } catch (e) {}
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[data-page]') : null;
    if (a) { e.preventDefault(); show(a.dataset.page, a.dataset.section || null, true); }
  });
  window.addEventListener('hashchange', function () { show(location.hash.replace('#', ''), null, false); });

  var start = location.hash.replace('#', '');
  if (tokens.indexOf(start) < 0) { try { start = localStorage.getItem('rpg-page') || tokens[0]; } catch (e) { start = tokens[0]; } }
  syncNav();
  show(start, null, false);
})();
</script>
</body>
</html>
